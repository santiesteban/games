<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee8fa"><title>Little Ledges</title>

</head>
<body>
  <main class="app"><section class="stage" aria-label="Little Ledges game" inert>

    <header class="game-header"><div class="topline"><div class="brand"><span class="brandmark" aria-hidden="true"><span class="logo-letter">L</span></span><span class="brand-name">little ledges</span></div><span class="edition">PULL · CLIMB · DISCOVER</span></div><div class="heading"><h1><span class="level-number" id="level-number">07</span><span id="level-title">Pull out a path</span></h1></div></header>
    <div class="canvas-wrap" id="canvasWrap"><div class="toast on" id="toast" role="status" aria-live="polite">Select a block to pull it. Click a walking spot to move Pom.</div><div class="canvas-actions" aria-label="Move selected block"><button class="btn block-action" id="push" disabled><span aria-hidden="true">←</span> Push in</button><button class="btn block-action" id="pull" disabled>Pull out <span aria-hidden="true">→</span></button></div></div>
    <footer class="control-deck"><div class="compact-actions"><button class="btn" id="undo" disabled>↻ Undo</button><button class="btn" id="reset" disabled>Start over</button><button class="btn" id="exitLevel">Levels</button></div><button class="view-toggle" id="toggleView" role="switch" aria-checked="true" aria-label="Looking right. Switch to look left"><span class="view-toggle-label">Look right</span><span class="toggle-track" aria-hidden="true"><span class="toggle-thumb">→</span></span></button></footer>
  </section>
  <div class="menu-screen" id="menuScreen" role="dialog" aria-modal="true" aria-label="Little Ledges menu" tabindex="0">
    <section class="menu-panel title-panel" id="titlePanel"><span class="menu-mark" aria-hidden="true">L</span><h1>little ledges</h1><p class="menu-kicker">A little world of pull and climb puzzles</p><button class="menu-primary" id="openLevels" disabled>Loading your puzzles…</button></section>
    <section class="menu-panel levels-panel" id="levelsPanel" hidden><button class="menu-back" id="backTitle">← Home</button><p class="menu-kicker">Pick a puzzle</p><h1>Choose a level</h1><div class="level-list" id="levelList" aria-label="All levels"></div></section>
  </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body></html>
