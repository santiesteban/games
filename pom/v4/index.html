<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee8fa"><title>Little Ledges</title>

</head>
<body>
  <main class="app"><section class="stage" aria-label="Little Ledges game" inert>

    <header class="game-header"><button class="brandmark game-back" id="exitLevel" aria-label="Back to levels"><span class="back-arrow" aria-hidden="true">←</span></button><div class="heading"><h1><span class="level-number" id="level-number">07</span><span id="level-title">Pull out a path</span></h1></div></header>
    <div class="canvas-wrap" id="canvasWrap"><div class="toast on" id="toast" role="status" aria-live="polite">Select a block to pull it. Click a walking spot to move Pom.</div><div class="studio-controls" id="studioControls" hidden><select id="movementCase" aria-label="Movement example"></select><button class="btn" id="previewClimb">Replay movement</button></div><div class="canvas-actions" aria-label="Move selected block"><button class="btn block-action" id="push" disabled><span aria-hidden="true">←</span> Push in</button><button class="btn block-action" id="pull" disabled>Pull out <span aria-hidden="true">→</span></button></div></div>
    <footer class="control-deck"><div class="compact-actions"><button class="btn" id="undo" disabled>↻ Undo</button><button class="btn" id="reset" disabled>Start over</button></div><div class="view-controller" id="viewController" role="group" aria-label="View angle">
      <span class="view-drag-arrows" aria-hidden="true"><span data-drag-direction="up">↑</span><span data-drag-direction="left">←</span><span data-drag-direction="right">→</span><span data-drag-direction="down">↓</span></span>
      <button class="view-cube" id="toggleView" type="button" aria-label="View: left and down. Drag to turn" aria-describedby="viewDragHelp" title="Drag to turn · arrow keys to adjust">
        <svg viewBox="0 0 76 58" fill="none" aria-hidden="true" focusable="false"><defs><clipPath id="viewCubeClip"><path class="cube-clip"/></clipPath></defs><g class="cube-faces" clip-path="url(#viewCubeClip)"><path class="cube-top"/><path class="cube-side"/><path class="cube-front"/><path class="cube-seams"/></g><path class="cube-outline"/><g class="cube-eye"><path d="M-11 0Q0-12 11 0Q0 12-11 0Z"/><circle r="4"/><circle class="eye-glint" cx="-1" cy="-1" r="1"/></g></svg>
      </button>
      <span class="view-drag-help" id="viewDragHelp">Drag left or right for three side angles, and up or down for two heights. You can also use the arrow keys.</span>
    </div><div class="victory-actions" id="victoryActions" hidden><button class="btn" id="victoryLevels">View all levels</button><button class="btn victory-next" id="nextLevel">Next level →</button></div></footer>
  </section>
  <div class="menu-screen" id="menuScreen" role="dialog" aria-modal="true" aria-label="Little Ledges menu" tabindex="0">
    <section class="menu-panel title-panel" id="titlePanel"><span class="menu-mark" aria-hidden="true">L</span><h1>little ledges</h1><p class="menu-kicker">A little world of pull and climb puzzles</p><button class="menu-primary" id="openLevels" disabled>Loading your puzzles…</button></section>
    <section class="menu-panel levels-panel" id="levelsPanel" hidden><header class="levels-topbar"><button class="brandmark menu-home" id="backTitle" aria-label="Back to home"><span class="back-arrow" aria-hidden="true">←</span></button><div class="levels-brand"><span class="brandmark levels-brandmark" aria-hidden="true">L</span><span>little ledges</span></div></header><div class="level-list" id="levelList" aria-label="All levels" tabindex="0"></div></section>
  </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body></html>
