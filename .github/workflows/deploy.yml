name: Deploy games site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            pom/v0.02/package-lock.json
            pom/v0.03/package-lock.json
            pom/package-lock.json
            pom/creator/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Pom v0.02 dependencies
        run: npm ci
        working-directory: pom/v0.02

      - name: Build Pom v0.02
        run: npm run build
        working-directory: pom/v0.02

      - name: Install Pom v0.03 dependencies
        run: npm ci
        working-directory: pom/v0.03

      - name: Check Pom v0.03 occlusion
        run: npm test
        working-directory: pom/v0.03

      - name: Build Pom v0.03
        run: npm run build
        working-directory: pom/v0.03

      - name: Install Little Ledges dependencies
        run: npm ci
        working-directory: pom

      - name: Build Little Ledges
        env:
          VITE_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build
        working-directory: pom

      - name: Build isolated puzzle playtest
        env:
          VITE_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build:playtest
        working-directory: pom

      - name: Install Puzzle Maker dependencies
        run: npm ci
        working-directory: pom/creator

      - name: Build Puzzle Maker
        env:
          VITE_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build
        working-directory: pom/creator

      - name: Stage the site
        run: node pom/scripts/stage-site.mjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
