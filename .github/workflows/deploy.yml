name: Deploy games site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            pom/v2/package-lock.json
            pom/v3/package-lock.json
            pom/v4/package-lock.json
            pom/creator/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Pom dependencies
        run: npm ci
        working-directory: pom/v2

      - name: Build Pom v2
        run: npm run build
        working-directory: pom/v2

      - name: Install Pom v3 dependencies
        run: npm ci
        working-directory: pom/v3

      - name: Check Pom v3 occlusion
        run: npm test
        working-directory: pom/v3

      - name: Build Pom v3
        run: npm run build
        working-directory: pom/v3

      - name: Install Pom v4 dependencies
        run: npm ci
        working-directory: pom/v4

      - name: Build Pom v4
        env:
          VITE_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build
        working-directory: pom/v4

      - name: Build isolated puzzle playtest
        env:
          VITE_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build:playtest
        working-directory: pom/v4

      - name: Install Puzzle Maker dependencies
        run: npm ci
        working-directory: pom/creator

      - name: Build Puzzle Maker
        env:
          VITE_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build
        working-directory: pom/creator

      - name: Stage the site
        run: |
          mkdir -p _site/pom/v1 _site/pom/v2 _site/pom/v3 _site/pom/v4 _site/pom/creator _site/pom/playtest
          cp pom/index.html pom/meadow-foreground.png pom/sky-background.png _site/pom/
          cp -a pom/v1/. _site/pom/v1/
          cp -a pom/v2/dist/. _site/pom/v2/
          cp -a pom/v3/dist/. _site/pom/v3/
          cp -a pom/v4/dist/. _site/pom/v4/
          cp -a pom/creator/dist/. _site/pom/creator/
          cp -a pom/v4/dist-playtest/. _site/pom/playtest/
          touch _site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
